version: 1

# 리뷰 봇(codex·gemini·claude)이 PR 에서 읽지 않을 경로.
#
# include 는 두지 않는다. 두면 거기 적지 않은 타깃·파일 종류(다른 플랫폼 앱, entitlements,
# PrivacyInfo.xcprivacy, 워크플로·도구 …)가 아무 말 없이 리뷰에서 빠진다. 뺄 것만 적고
# 나머지는 모두 본다(조직 PR 운영 문서).
#
# 봇마다 이 파일을 읽는 방식이 달라 좁은 형식만 쓴다: `review:` 아래 두 칸 들여쓴 키,
# 그 아래 `- "패턴"` 줄. 해석하지 못하면 봇은 리뷰를 멈추고 PR 에 안내만 남긴다(fail closed).
# PR 이 이 파일을 바꾸면 base 의 정책도 함께 적용된다. 모르는 키는 경고 없이 넘어가니 키 이름을 확인한다.
# 디렉터리는 `dir/` 가 아니라 `dir/**` 로 적는다.

review:
  exclude:
    # ── 비밀 재료 — 강제로 커밋돼도 외부 모델로 보내지 않는다 ──
    # 매칭이 대소문자를 가리므로 확장자는 글자마다 [pP] 처럼 적어 어떤 표기든 막는다(`Dist.P12`·`signing.Pem`).
    # 배포 키는 정확한 이름(ci_deploy·.pub·.bak)만 — ci_deploy* 는 ci_deploy.sh 같은 스크립트까지 뺀다.
    - "**/*.[pP]8"
    - "**/*.[pP]12"
    - "**/*.[pP][fF][xX]"
    - "**/*.[mM][oO][bB][iI][lL][eE][pP][rR][oO][vV][iI][sS][iI][oO][nN]"
    - "**/*.[pP][rR][oO][vV][iI][sS][iI][oO][nN][pP][rR][oO][fF][iI][lL][eE]"
    - "**/*.[cC][eE][rR][tT][sS][iI][gG][nN][iI][nN][gG][rR][eE][qQ][uU][eE][sS][tT]"
    - "**/*.[cC][eE][rR]"
    - "**/*.[cC][rR][tT]"
    - "**/*.[dD][eE][rR]"
    - "**/*.[kK][eE][yY][cC][hH][aA][iI][nN]-[dD][bB]"
    - "**/*.[kK][eE][yY][cC][hH][aA][iI][nN]"
    - "**/*.[pP][eE][mM]"
    - "**/*.[kK][eE][yY]"
    - "**/*.[jJ][kK][sS]"
    - "**/*.[kK][eE][yY][sS][tT][oO][rR][eE]"
    - "**/id_rsa*"
    - "**/id_dsa*"
    - "**/id_ecdsa*"
    - "**/id_ed25519*"
    - "**/ci_deploy"
    - "**/ci_deploy.pub"
    - "**/ci_deploy.bak"
    - "**/.netrc"
    - "**/.[eE][nN][vV]"
    - "**/.[eE][nN][vV].*"
    # 이름 끝이 .env 인 환경 파일(prod.env·naver-mcp.env)과 direnv 파일.
    - "**/*.[eE][nN][vV]"
    - "**/.[eE][nN][vV][rR][cC]"

    # ── Firebase·Google 로그인 설정 — API 키·클라이언트 ID 만 있고 리뷰할 로직이 없다 ──
    - "**/GoogleService-Info.plist"
    - "**/*.apps.googleusercontent.com.plist"

    # ── 빌드·의존성 산출물 ──
    - "build/**"
    - "**/.build/**"
    - "**/DerivedData/**"
    - "**/Pods/**"
    - "**/Carthage/**"
    - "**/node_modules/**"
    - "**/.swiftpm/xcode/**"
    - "**/xcuserdata/**"
    - "**/*.xcuserstate"
    - "**/*.xcresult/**"
    - "**/*.xcarchive/**"
    - "**/*.doccarchive/**"
    - "**/*.dSYM/**"
    - "**/*.ipa"

    # ── LicensePlist 가 만든 라이선스 목록 ──
    - "**/Settings.bundle/Acknowledgements.plist"
    - "**/Settings.bundle/Acknowledgements/**"
    - "**/Settings.bundle/com.mono0926.LicensePlist.plist"
    - "**/Settings.bundle/com.mono0926.LicensePlist/**"
    - "**/Settings.bundle/com.mono0926.LicensePlist.latest_result.txt"

    # ── 코드 생성기가 만든 소스 — 생성기의 입력을 리뷰한다 ──
    # 파일 이름으로만 뺀다 — 폴더 이름(`Generated/`)으로 빼면 그 안에 사람이 쓴 파일까지 빠진다.
    - "**/*.generated.swift"
    - "**/*+Generated.swift"
    - "**/*.pb.swift"
    - "**/*.graphql.swift"

    # ── 에이전트·편집기·OS 부산물 ──
    # .claude·.vscode·.idea 는 폴더째 빼지 않는다(hooks·tasks·실행 설정은 명령을 실행하므로 리뷰). 개인 파일만 뺀다.
    - "**/.claude/settings.local.json"
    - "**/.claude/worktrees/**"
    - "**/.codex/**"
    - "**/.gemini/**"
    - "**/.gstack/**"
    - "**/.idea/workspace.xml"
    - "**/.idea/shelf/**"
    - "**/.idea/usage.statistics.xml"
    - "**/*.swp"
    - "**/.DS_Store"
    - "**/._*"
    - "**/*.log"

    # ── 바이너리·디자인 자산 — 리뷰할 텍스트가 없다 ──
    # 에셋 카탈로그의 Contents.json 은 이미지 묶음의 목록이다. Keynote(.key)는 위에서 막힌다.
    - "**/*.xcassets/**"
    - "**/*.png"
    - "**/*.PNG"
    - "**/*.jpg"
    - "**/*.JPG"
    - "**/*.jpeg"
    - "**/*.JPEG"
    - "**/*.gif"
    - "**/*.webp"
    - "**/*.heic"
    - "**/*.HEIC"
    - "**/*.ico"
    - "**/*.icns"
    - "**/*.pdf"
    - "**/*.ttf"
    - "**/*.otf"
    - "**/*.wav"
    - "**/*.mp3"
    - "**/*.m4a"
    - "**/*.caf"
    - "**/*.aiff"
    - "**/*.mov"
    - "**/*.mp4"
    - "**/*.usdz"
    - "**/*.pxd"
    - "**/*.psd"
    - "**/*.sketch"
    - "**/*.sqlite"
    - "**/*.sqlite3"
    - "**/*.zip"
    - "**/*.tar.gz"
    - "**/*.dmg"
    - "**/*.pkg"

    # ── Python 가상 환경·캐시·패키지 산출물 ──
    - "**/.venv/**"
    - "**/venv/**"
    - "**/__pycache__/**"
    - "**/.pytest_cache/**"
    - "**/.mypy_cache/**"
    - "**/.ruff_cache/**"
    - "**/*.egg-info/**"
    - "**/dist/**"
    # PyPI 업로드 토큰.
    - "**/.pypirc"

  # exclude 보다 먼저 적용된다. 좁게 적는다 — 넓게 적으면 비밀 재료 규칙을 덮는다.
  always_review:
    # 봇은 이 파일을 PR 의 head 에서 읽고, PR 이 이 파일을 바꾸면 base 의 정책도 함께 적용한다. PR 이 리뷰 범위를 바꾸는 것을 리뷰가 보게 한다.
    - ".reviewbot.yml"
    # 비밀 재료를 커밋 단계에서 막는 곳이다. 무시 규칙을 바꾸는 PR 을 리뷰가 보게 한다.
    - ".gitignore"
    # 예시 파일을 다른 이름(.env.sample 등)으로 두면 위 `**/.env.*` 에 걸린다 — 이름을 바꾸면 이 줄도 함께 고친다.
    - "**/.env.example"
